    <div class="app" id="emulator-target">

      <div class="control-layout">

          <button>L</button>
          <button>R</button>
        </div>

        <div class="pauseSelect">

          <button>P</button>
        </div>

            <button class="vertical">ATS</button>
            <div class="horizontal">

              <button>KN</button>
            </div>

          </div>

            <button>B</button>
